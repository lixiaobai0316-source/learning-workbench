<style>
:root{
  --bg:#ffffff;--surface:#f7f7f9;--surface-2:#f0f0f3;--ink:#1d1d1f;--muted:#86868b;
  --muted-2:#aeaeb2;--rule:#e8e8ed;--rule-soft:#f0f0f3;--accent:#1d1d1f;
  --blue:#0071e3;--green:#34c759;--amber:#ff9f0a;--red:#ff3b30;
  --radius:16px;--radius-sm:11px;--shadow-sm:0 1px 2px rgba(0,0,0,.04);
  --nav-h:52px;--bottom-h:62px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;
  padding-top:calc(var(--nav-h) + var(--safe-top));padding-bottom:calc(var(--bottom-h) + var(--safe-bottom) + 16px);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"tnum";}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
a{color:inherit;text-decoration:none;}ul{list-style:none;}
::selection{background:rgba(0,113,227,.15);}
.empty-hint{text-align:center;color:var(--muted-2);font-size:14px;padding:40px 16px;line-height:1.8;}

/* 顶部导航 */
.navbar{position:fixed;top:0;left:0;right:0;z-index:100;height:calc(var(--nav-h) + var(--safe-top));padding-top:var(--safe-top);
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--rule);}
.navbar-inner{height:var(--nav-h);display:flex;align-items:center;gap:4px;max-width:1100px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
.navbar-inner::-webkit-scrollbar{display:none;}
.nav-item{flex-shrink:0;height:34px;padding:0 14px;border-radius:980px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;display:flex;align-items:center;transition:all .2s;}
.nav-item:hover{color:var(--ink);background:var(--surface);}
.nav-item.active{background:var(--ink);color:#fff;font-weight:600;}

.wrap{max-width:760px;margin:0 auto;padding:0 16px;}
.view{display:none;animation:fade .35s ease;}.view.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.page-head{padding:20px 2px 14px;}.page-title{font-size:28px;font-weight:700;letter-spacing:-.02em;}
.page-sub{font-size:14px;color:var(--muted);margin-top:4px;}
.section{margin-top:26px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 2px;}
.section-title{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.section-more{font-size:13px;color:var(--muted);}
.card{background:var(--bg);border:.5px solid var(--rule);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;}

/* 数据看板 */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.stat-card{background:var(--bg);border:.5px solid var(--rule);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-sm);}
.stat-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:14px;}
.stat-num{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;}
.stat-label{font-size:13px;color:var(--muted);margin-top:6px;}
.stat-trend{font-size:11px;margin-top:8px;font-weight:600;}
.trend-up{color:var(--green);}.trend-flat{color:var(--muted);}

/* 日历 */
.cal-card{padding:18px 16px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-month{font-size:17px;font-weight:700;}
.cal-nav{display:flex;gap:6px;}
.cal-btn{width:30px;height:30px;border-radius:8px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);transition:.2s;}
.cal-btn:hover{background:var(--surface-2);color:var(--ink);}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-bottom:6px;}
.cal-week span{font-size:11px;color:var(--muted-2);font-weight:600;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:10px;color:var(--ink);position:relative;transition:.15s;}
.cal-day.empty{pointer-events:none;}.cal-day.other{color:var(--muted-2);}
.cal-day.has-update::after{content:'';position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--blue);}
.cal-day.today{font-weight:700;color:var(--blue);}
.cal-day.selected{background:var(--ink);color:#fff;font-weight:600;}
.cal-day.selected.has-update::after{background:#fff;}
.cal-day.selected.today{color:#fff;}
.cal-day.checked{background:var(--green);color:#fff;font-weight:600;}
.cal-day:not(.empty):not(.selected):hover{background:var(--surface);}
.cal-legend{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:.5px solid var(--rule-soft);font-size:12px;color:var(--muted);}
.legend-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:5px;vertical-align:middle;}
.cal-day-detail{margin-top:14px;padding-top:14px;border-top:.5px solid var(--rule-soft);min-height:40px;}
.cal-day-detail .d-title{font-size:14px;font-weight:600;margin-bottom:8px;}
.cal-day-detail .d-list{font-size:13px;color:var(--muted);line-height:1.9;}
.cal-day-detail .d-empty{font-size:13px;color:var(--muted-2);}
.day-link{display:flex;align-items:center;gap:6px;padding:6px 0;color:var(--ink);}
.day-link:active{color:var(--blue);}
.day-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface);color:var(--ink);margin-right:6px;font-weight:500;}

/* 内容列表项（通用，可点击打开详情） */
.item{display:flex;gap:12px;padding:14px 16px;border-bottom:.5px solid var(--rule-soft);transition:.15s;cursor:pointer;align-items:flex-start;}
.item:last-child{border-bottom:none;}
.item:active{background:var(--surface);}
.item-icon{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface);}
.item-body{flex:1;min-width:0;}
.item-top{display:flex;align-items:center;gap:8px;margin-bottom:3px;}
.item-cat{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--surface);color:var(--muted);}
.item-date{font-size:11px;color:var(--muted-2);margin-left:auto;}
.item-title{font-size:15px;font-weight:500;line-height:1.4;}
.item-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.item-status{flex-shrink:0;font-size:13px;align-self:center;}
.item-status.done{color:var(--green);}.item-status.todo{color:var(--amber);}
.item-num{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--muted);}
.item.done .item-title{color:var(--muted);}
.chevron{flex-shrink:0;align-self:center;color:var(--muted-2);font-size:14px;}

/* 打卡 */
.checkin-card{padding:18px 16px;}
.checkin-template{background:var(--surface);border-radius:var(--radius-sm);padding:16px;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.85;white-space:pre-wrap;word-break:break-all;color:var(--ink);}
.copy-btn{margin-top:14px;width:100%;height:46px;border-radius:var(--radius-sm);background:var(--ink);color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px;transition:.2s;}
.copy-btn:active{transform:scale(.98);opacity:.85;}.copy-btn.copied{background:var(--green);}
.toast{position:fixed;bottom:calc(var(--bottom-h) + var(--safe-bottom) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;padding:11px 22px;border-radius:100px;opacity:0;pointer-events:none;transition:all .3s;z-index:400;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 进度总览 */
.progress-summary{display:flex;align-items:center;gap:16px;padding:16px;}
.ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{stroke:var(--rule);}.ring-fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .8s ease;}
.ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;}
.progress-info{flex:1;}
.progress-info .pi-num{font-size:13px;color:var(--muted);}
.progress-info .pi-num b{color:var(--ink);font-size:20px;}
.progress-tags{display:flex;gap:14px;margin-top:6px;font-size:12px;}
.pt-done{color:var(--green);}.pt-todo{color:var(--amber);}

/* 书籍 */
.book-current{padding:16px;display:flex;align-items:center;gap:14px;}
.book-cover{width:48px;height:64px;border-radius:6px;background:linear-gradient(135deg,var(--ink),#4a4a4f);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0;}
.book-info{flex:1;}
.book-current-label{font-size:11px;color:var(--muted);font-weight:600;}
.book-current-name{font-size:17px;font-weight:600;margin-top:2px;}

/* 周汇总 */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:18px 16px;}
.week-bar{display:flex;flex-direction:column;align-items:center;gap:6px;}
.week-bar-fill{width:100%;background:var(--surface);border-radius:6px;height:120px;display:flex;align-items:flex-end;}
.week-bar-fill span{width:100%;background:linear-gradient(180deg,var(--blue),#4a9eff);border-radius:6px;transition:height .8s;}
.week-bar.today .week-bar-fill span{background:linear-gradient(180deg,var(--ink),#4a4a4f);}
.week-bar-label{font-size:11px;color:var(--muted);font-weight:500;}
.week-bar.today .week-bar-label{color:var(--ink);font-weight:700;}
.week-bar-val{font-size:11px;color:var(--ink);font-weight:600;}
.week-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 16px 16px;}
.week-stat{background:var(--surface);border-radius:var(--radius-sm);padding:14px;text-align:center;}
.week-stat .ws-num{font-size:22px;font-weight:700;}
.week-stat .ws-label{font-size:12px;color:var(--muted);margin-top:3px;}

/* 打卡进度 */
.streak-hero{text-align:center;padding:26px 16px 22px;}
.streak-num{font-size:56px;font-weight:700;letter-spacing:-.03em;line-height:1;}
.streak-num span{font-size:18px;color:var(--muted);font-weight:500;margin-left:4px;}
.streak-label{font-size:14px;color:var(--muted);margin-top:8px;}
.streak-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:0 16px 18px;}
.streak-cell{aspect-ratio:1;border-radius:7px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted-2);}
.streak-cell.checked{background:var(--green);color:#fff;font-weight:600;}

/* 底部 */
.bottombar{position:fixed;bottom:0;left:0;right:0;z-index:100;height:calc(var(--bottom-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--rule);}
.bottombar-inner{height:var(--bottom-h);max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-around;padding:0 8px;}
.bb-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;border-radius:10px;transition:.15s;color:var(--muted);}
.bb-item:active{background:var(--surface);}.bb-item.active{color:var(--ink);}
.bb-icon{font-size:20px;line-height:1;}.bb-label{font-size:10.5px;font-weight:500;}

/* 详情弹层 */
.modal-mask{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px);}
.modal-mask.show{opacity:1;pointer-events:auto;}
.modal{position:fixed;z-index:510;left:50%;top:50%;transform:translate(-50%,-46%);width:100%;max-width:680px;max-height:88vh;background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);overflow:hidden;}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%);}
.modal-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:.5px solid var(--rule);flex-shrink:0;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted);flex-shrink:0;}
.modal-meta{flex:1;min-width:0;}
.modal-meta .mm-cat{font-size:12px;font-weight:600;color:var(--blue);}
.modal-meta .mm-date{font-size:11px;color:var(--muted-2);margin-top:1px;}
.modal-actions{display:flex;gap:8px;flex-shrink:0;}
.modal-btn{height:32px;padding:0 14px;border-radius:980px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;transition:.2s;}
.modal-btn.toggle{background:var(--surface);color:var(--ink);}
.modal-btn.toggle.done{background:var(--green);color:#fff;}
.modal-btn.src{background:var(--surface);color:var(--muted);}
.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px calc(20px + var(--safe-bottom));}
/* Markdown 渲染样式 */
.md h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px;line-height:1.3;}
.md h2{font-size:18px;font-weight:700;margin:20px 0 10px;padding-bottom:6px;border-bottom:.5px solid var(--rule);}
.md h3{font-size:16px;font-weight:600;margin:16px 0 8px;}
.md h4{font-size:14px;font-weight:600;margin:12px 0 6px;color:var(--muted);}
.md p{font-size:15px;line-height:1.75;margin-bottom:12px;color:var(--ink);}
.md ul,.md ol{margin:0 0 12px;padding-left:22px;}
.md li{font-size:15px;line-height:1.75;margin-bottom:4px;}
.md blockquote{border-left:3px solid var(--blue);padding:6px 14px;margin:12px 0;background:var(--surface);border-radius:0 8px 8px 0;color:var(--ink);font-size:14.5px;}
.md blockquote p{margin-bottom:0;}
.md code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;background:var(--surface);padding:2px 6px;border-radius:5px;}
.md hr{border:none;border-top:.5px solid var(--rule);margin:18px 0;}
.md table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;}
.md th,.md td{border:.5px solid var(--rule);padding:8px 10px;text-align:left;}
.md th{background:var(--surface);font-weight:600;}
.md strong{font-weight:700;color:var(--ink);}
.md a{color:var(--blue);}

@media(min-width:680px){
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .navbar-inner{justify-content:center;}
  .wrap{padding:0 24px;}
  .modal{border-radius:var(--radius);}
}
@media(min-width:860px){.stat-num{font-size:34px;}}
</style>
</head>

    <div class="section">

      <div class="card" id="todayUpdateList"></div>
    </div>

      <div class="section-head"><div class="section-title">一键打卡</div><div class="section-more">复制模板即可发布</div></div>

        <button class="copy-btn" id="copyBtn"><span id="copyIcon">📋</span><span id="copyText">一键复制打卡模板</span></button>
      </div>
    </div>
    <div class="section">
      <div class="section-head"><div class="section-title">学习进度总览</div><div class="section-more">点击内容查看详情</div></div>
      <div class="card">
        <div class="progress-summary">
          <div class="ring-wrap"><svg width="72" height="72"><circle class="ring-bg" cx="36" cy="36" r="30" fill="none" stroke-width="6"/><circle class="ring-fg" id="ringFg" cx="36" cy="36" r="30" fill="none" stroke-width="6" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><div class="ring-text" id="ringText">0%</div></div>
          <div class="progress-info"><div class="pi-num">已读 <b id="doneCount">0</b> / <span id="totalCount">0</span> 项</div>

        <div id="progressList"></div>
      </div>

  <section class="view" id="view-tongshi"><div class="page-head"><div class="page-title">通史</div><div class="page-sub" id="sub-tongshi"></div></div><div class="card" id="list-tongshi"></div></section>
  <section class="view" id="view-jindai"><div class="page-head"><div class="page-title">近代史</div><div class="page-sub" id="sub-jindai"></div></div><div class="card" id="list-jindai"></div></section>
  <section class="view" id="view-zixun"><div class="page-head"><div class="page-title">资讯</div><div class="page-sub" id="sub-zixun"></div></div><div class="card" id="list-zixun"></div></section>
  <section class="view" id="view-kouyu"><div class="page-head"><div class="page-title">口语</div><div class="page-sub" id="sub-kouyu"></div></div><div class="card" id="list-kouyu"></div></section>
  <section class="view" id="view-shuji"><div class="page-head"><div class="page-title">书籍</div><div class="page-sub" id="sub-shuji"></div></div>
    <div class="card" id="bookCard"></div><div class="card" id="list-shuji" style="margin-top:12px;"></div></section>
  <section class="view" id="view-daka">

<script>

var today = new Date();

function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

document.getElementById("todayStr").textContent =
  todayISO.replace(/-/g,"年").replace(/年(\d\d)$/,"年$1").replace(/-/,"月")+"日 · "+weekdays[today.getDay()]+" · 数据更新于 "+(D.meta?D.meta.generatedAt:"");

/* ===== 轻量 Markdown → HTML ===== */
function mdToHtml(md){
  if(!md) return "";
  var lines = md.split(/\r?\n/);
  var html=[], inUl=false, inOl=false, inTable=false, tableRows=[];
  function closeLists(){ if(inUl){html.push("</ul>");inUl=false;} if(inOl){html.push("</ol>");inOl=false;} }
  function closeTable(){ if(inTable){ renderTable(); inTable=false; tableRows=[]; } }
  function renderTable(){
    if(!tableRows.length) return;
    html.push('<table>');
    tableRows.forEach(function(row,i){
      var cells = row.replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim();});
      html.push(i===0?'<thead><tr>':'<tr>');
      cells.forEach(function(c){ html.push(i===0?'<th>':'<td>'); html.push(inline(c)); html.push(i===0?'</th>':'</td>'); });
      html.push(i===0?'</tr></thead><tbody>':'</tr>');
    });
    if(tableRows.length>1) html.push('</tbody>');
    html.push('</table>');
  }
  function inline(s){
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
    return s;
  }
  for(var i=0;i<lines.length;i++){
    var line = lines[i], s = line.trim();
    if(!s){ closeLists(); closeTable(); continue; }
    // 表格
    if(/^\|.*\|$/.test(s)){ closeLists(); inTable=true; if(s.replace(/[^\|]/g,"").length>=2 && /^[\s|\-:]+$/.test(s.replace(/\|/g,"|").replace(/-/g,""))) continue; tableRows.push(s); continue; }
    else { closeTable(); }
    if(s.startsWith("# ")){ closeLists(); html.push('<h1>'+inline(s.slice(2))+'</h1>'); }
    else if(s.startsWith("## ")){ closeLists(); html.push('<h2>'+inline(s.slice(3))+'</h2>'); }
    else if(s.startsWith("### ")){ closeLists(); html.push('<h3>'+inline(s.slice(4))+'</h3>'); }
    else if(s.startsWith("#### ")){ closeLists(); html.push('<h4>'+inline(s.slice(5))+'</h4>'); }
    else if(s.startsWith("> ")){ closeLists(); html.push('<blockquote><p>'+inline(s.slice(2))+'</p></blockquote>'); }
    else if(s==="---"||s==="***"){ closeLists(); html.push('<hr>'); }
    else if(/^\d+\.\s+/.test(s)){ if(inUl){html.push('</ul>');inUl=false;} if(!inOl){html.push('<ol>');inOl=true;} html.push('<li>'+inline(s.replace(/^\d+\.\s+/,""))+'</li>'); }
    else if(/^[-*]\s+/.test(s)){ if(inOl){html.push('</ol>');inOl=false;} if(!inUl){html.push('<ul>');inUl=true;} html.push('<li>'+inline(s.replace(/^[-*]\s+/,""))+'</li>'); }
    else { closeLists(); html.push('<p>'+inline(s)+'</p>'); }
  }
  closeLists(); closeTable();
  return html.join("");
}

var navItems=document.querySelectorAll(".nav-item"), bbItems=document.querySelectorAll(".bb-item"), views=document.querySelectorAll(".view");
function switchView(name){

}

/* ===== 复制打卡模板 ===== */
function buildCheckinText(){

  var lines = ["📚 学习打卡 | "+todayISO.replace(/-/g,"年").replace(/年(\d\d)$/,"年$1").replace(/-/,"月")+"日（"+weekdays[today.getDay()]+"）","━━━━━━━━━━━━━━━━","✅ 今日学习内容："];
  doneArts.forEach(function(a,i){lines.push((i+1)+". ["+a.catName+"] "+a.title);});
  if(!doneArts.length) lines.push("（今日暂无更新内容）");
  var doneCount = articles.filter(isDone).length;
  lines.push("","📊 累计完成："+doneCount+" 篇","🔥 连续学习："+(D.stats&&D.stats.streakDays||0)+" 天","⏳ 待学习剩余："+(articles.length-doneCount)+" 篇","━━━━━━━━━━━━━━━━","#每日学习打卡 #持续精进");
  return lines.join("\n");
}
var tplEl=document.getElementById("checkinTpl");
function refreshTpl(){ tplEl.textContent = buildCheckinText(); }
refreshTpl();
var copyBtn=document.getElementById("copyBtn");
function doCopy(){
  var text=tplEl.textContent;
  function after(ok){
    if(ok){var ic=document.getElementById("copyIcon"),t=document.getElementById("copyText");ic.textContent="✓";t.textContent="已复制，去发布打卡";copyBtn.classList.add("copied");showToast("打卡模板已复制 ✓");setTimeout(function(){ic.textContent="📋";t.textContent="一键复制打卡模板";copyBtn.classList.remove("copied");},2500);}
    else showToast("复制失败，请长按手动复制");
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){after(true);}).catch(function(){fallback(text,after);});}
  else fallback(text,after);
}
function fallback(text,cb){try{var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.top="-9999px";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);cb(ok);}catch(e){cb(false);}}
copyBtn.addEventListener("click",doCopy);
document.querySelector("[data-copy]").addEventListener("click",doCopy);

/* ===== 详情弹层 ===== */
var modalMask=document.getElementById("modalMask"), modal=document.getElementById("modal");
var modalBody=document.getElementById("modalBody"), modalCat=document.getElementById("modalCat"), modalDate=document.getElementById("modalDate");
var modalToggle=document.getElementById("modalToggle"), modalSrc=document.getElementById("modalSrc");
var currentArticle=null;
function openArticle(a){
  currentArticle=a;
  modalCat.textContent=(a.icon||"")+" "+a.catName;
  modalDate.textContent=a.date+(a.book?" · "+a.book:"")+" · 来源: "+a.path;

function closeModal(){modalMask.classList.remove("show");modal.classList.remove("show");document.body.style.overflow="";currentArticle=null;}

  if(!currentArticle) return;
  var d=isDone(currentArticle);

  modalToggle.classList.toggle("done", d);
}
modalClose.addEventListener("click",closeModal);
modalMask.addEventListener("click",closeModal);
modalToggle.addEventListener("click",function(){ if(currentArticle){ toggleDone(currentArticle); updateModalToggle(); renderAll(); refreshTpl(); showToast(isDone(currentArticle)?"已标记为已读":"已取消已读"); } });
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});

/* ===== 渲染内容列表项 ===== */
function renderItem(a, withNum){
  var d=isDone(a);
  var div=document.createElement("div");
  div.className="item"+(d?" done":"");
  div.innerHTML = (withNum?'<div class="item-num"></div>':'<div class="item-icon">'+(a.icon||"📄")+'</div>')+
    '<div class="item-body"><div class="item-top"><span class="item-cat">'+a.catName+'</span><span class="item-date">'+a.date+'</span></div>'+
    '<div class="item-title">'+escapeHtml(a.title)+'</div>'+(a.summary?'<div class="item-desc">'+escapeHtml(a.summary)+'</div>':'')+'</div>'+
    '<div class="item-status '+(d?"done":"todo")+'">'+(d?"✅":"⭕")+'</div><div class="chevron">›</div>';
  div.addEventListener("click",function(){openArticle(a);});
  return div;
}

/* ===== 数据看板 ===== */
function renderStats(){
  var s=D.stats||{};
  var doneCount=articles.filter(isDone).length;
  var pending=articles.length-doneCount;
  var todayUpd=articles.filter(function(a){return a.date===todayISO;}).length;
  var cards=[
    {ic:"📥",bg:"rgba(0,113,227,.1)",n:todayUpd,lb:"今日更新",tr:"▲ 自动化已更新",cls:"trend-up"},
    {ic:"⏳",bg:"rgba(255,159,10,.12)",n:pending,lb:"待学习",tr:pending>0?"— 保持节奏":"✓ 全部完成",cls:pending>0?"trend-flat":"trend-up"},
    {ic:"✅",bg:"rgba(52,199,89,.12)",n:doneCount,lb:"已读完成",tr:"▲ 完成率 "+(articles.length?Math.round(doneCount/articles.length*100):0)+"%",cls:"trend-up"},
    {ic:"🔥",bg:"rgba(255,59,48,.1)",n:(s.streakDays||0),lb:"连续学习天数",tr:(s.streakDays||0)>0?"▲ 持续中":"— 开始打卡",cls:(s.streakDays||0)>0?"trend-up":"trend-flat"}
  ];
  document.getElementById("statsGrid").innerHTML=cards.map(function(c){
    return '<div class="stat-card"><div class="stat-icon" style="background:'+c.bg+'">'+c.ic+'</div><div class="stat-num">'+c.n+'</div><div class="stat-label">'+c.lb+'</div><div class="stat-trend '+c.cls+'">'+c.tr+'</div></div>';
  }).join("");

/* ===== 今日更新 ===== */
function renderTodayUpdate(){

  var box=document.getElementById("todayUpdateList");
  document.getElementById("todayUpdateMore").textContent=list.length+" 条最新";

/* ===== 学习日历 ===== */
var calGrid=document.getElementById("calGrid"), calMonthEl=document.getElementById("calMonth"), calDetail=document.getElementById("calDetail");
var calDate=new Date(today.getFullYear(),today.getMonth(),1);
// 按日期聚合文章
var articlesByDate={};
articles.forEach(function(a){ var d=a.date.slice(0,10); if(/^\d{4}-\d{2}-\d{2}$/.test(d)){ (articlesByDate[d]=articlesByDate[d]||[]).push(a); } });
function renderCal(){
  var y=calDate.getFullYear(), m=calDate.getMonth();
  calMonthEl.textContent=y+"年"+(m+1)+"月";
  calGrid.innerHTML="";
  var firstDay=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate(), prevDays=new Date(y,m,0).getDate();
  for(var i=0;i<firstDay;i++){var el=document.createElement("div");el.className="cal-day other";el.textContent=prevDays-firstDay+1+i;calGrid.appendChild(el);}
  for(var day=1;day<=daysInMonth;day++){
    var ds=String(y)+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    var cell=document.createElement("div"); cell.className="cal-day"; cell.textContent=day;
    if(articlesByDate[ds]) cell.classList.add("has-update");
    if(y===today.getFullYear()&&m===today.getMonth()&&day===today.getDate()) cell.classList.add("today");
    (function(dd,ds2){cell.addEventListener("click",function(){
      document.querySelectorAll(".cal-day.selected").forEach(function(s){s.classList.remove("selected");});
      cell.classList.add("selected");
      var arts=articlesByDate[ds2];
      if(arts&&arts.length){
        var html='<div class="d-title">'+ds2+' 更新内容（点击查看）</div><div class="d-list">';
        arts.forEach(function(a){ html+='<div class="day-link"><span class="day-badge">'+a.catName+'</span>'+escapeHtml(a.title)+'</div>'; });
        html+='</div>'; calDetail.innerHTML=html;
        // 绑定点击打开
        calDetail.querySelectorAll(".day-link").forEach(function(el2,idx){ el2.addEventListener("click",function(){openArticle(arts[idx]);}); });
      } else calDetail.innerHTML='<div class="d-empty">'+ds2+' 暂无更新</div>';
    });})(day,ds);
    calGrid.appendChild(cell);
  }
  var total=firstDay+daysInMonth, after=(7-total%7)%7;
  for(var a2=1;a2<=after;a2++){var e2=document.createElement("div");e2.className="cal-day other";e2.textContent=a2;calGrid.appendChild(e2);}
}
document.getElementById("calPrev").addEventListener("click",function(){calDate.setMonth(calDate.getMonth()-1);renderCal();});
document.getElementById("calNext").addEventListener("click",function(){calDate.setMonth(calDate.getMonth()+1);renderCal();});

/* ===== 分类列表 ===== */
function renderCatList(catId, subId){

  box.innerHTML=""; list.forEach(function(a){box.appendChild(renderItem(a,true));});
}

    html+='<div style="padding:0 16px 14px;"><div style="font-size:12px;color:var(--muted);font-weight:600;margin-bottom:8px;">待读列表</div>';
    b.toRead.forEach(function(book,i){html+='<div style="font-size:14px;padding:7px 0;border-bottom:.5px solid var(--rule-soft);">'+(i+1)+'. '+escapeHtml(book)+'</div>';});
    html+='</div>';

/* ===== 进度总览 ===== */
function renderProgress(){
  var pl=document.getElementById("progressList");
  if(!articles.length){ pl.innerHTML='<div class="empty-hint">暂无学习内容<br>运行 sync_data.py 同步数据</div>'; }
  else { pl.innerHTML=""; articles.forEach(function(a){pl.appendChild(renderItem(a,true));}); }
  var done=articles.filter(isDone).length, total=articles.length, pct=total?Math.round(done/total*100):0;
  document.getElementById("doneCount").textContent=done;
  document.getElementById("totalCount").textContent=total;
  document.getElementById("doneNum").textContent=done;
  document.getElementById("todoNum").textContent=total-done;

  var ring=document.getElementById("ringFg"); ring.setAttribute("stroke-dasharray",circ); ring.setAttribute("stroke-dashoffset",circ-circ*pct/100);

/* ===== 打卡进度 ===== */
function renderStreak(){
  var streak=D.stats&&D.stats.streakDays||0;
  document.getElementById("streakNum").innerHTML=streak+'<span>天</span>';
  document.getElementById("streakLabel").textContent="连续学习 · "+(streak>=21?"已达成 21 天目标！🎉":"距 21 天目标还差 "+(21-streak)+" 天");
  var sg=document.getElementById("streakGrid"); sg.innerHTML="";
  for(var i=6;i>=0;i--){
    var dd=new Date(today); dd.setDate(today.getDate()-i);
    var ds=isoDate(dd);
    var has = articlesByDate[ds] && articlesByDate[ds].length;
    var cell=document.createElement("div");
    cell.className="streak-cell"+(has?" checked":"");
    cell.textContent=dd.getDate();
    sg.appendChild(cell);
  }
  // 本月打卡日历
  var y=today.getFullYear(), m=today.getMonth();
  var firstDay=new Date(y,m,1).getDay(), daysInMonth=new Date(y,m+1,0).getDate();
  var scg=document.getElementById("streakCalGrid"); scg.innerHTML="";
  for(var p=0;p<firstDay;p++){var e=document.createElement("div");e.className="cal-day empty";scg.appendChild(e);}
  var dc=0;
  for(var day=1;day<=daysInMonth;day++){
    var ds2=String(y)+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
    var has2=articlesByDate[ds2]&&articlesByDate[ds2].length;
    if(has2) dc++;
    var c=document.createElement("div"); c.className="cal-day";
    if(has2) c.classList.add("checked");
    c.textContent=day;
    if(y===today.getFullYear()&&m===today.getMonth()&&day===today.getDate()) c.classList.add("today");
    scg.appendChild(c);
  }
  document.getElementById("monthCheckCount").textContent="本月有内容 "+dc+" 天";
}

/* ===== 周汇总 ===== */
function renderWeek(){
  var now=today;
  var weekStart=new Date(now); weekStart.setDate(now.getDate()-((now.getDay()+6)%7));
  var days=["周一","周二","周三","周四","周五","周六","周日"];
  var vals=[], totalWeek=0;
  for(var i=0;i<7;i++){
    var d=new Date(weekStart); d.setDate(weekStart.getDate()+i);
    var ds=isoDate(d);
    var c=(articlesByDate[ds]||[]).length;
    vals.push(c); totalWeek+=c;
  }
  var max=Math.max.apply(null,vals)||1;
  var todayIdx=(now.getDay()+6)%7;
  var wg=document.getElementById("weekGrid"); wg.innerHTML="";
  days.forEach(function(label,idx){
    var h=Math.round(vals[idx]/max*100);
    var bar=document.createElement("div"); bar.className="week-bar"+(idx===todayIdx?" today":"");
    bar.innerHTML='<div class="week-bar-val">'+(vals[idx]||"—")+'</div><div class="week-bar-fill"><span style="height:'+(vals[idx]?h:0)+'%"></span></div><div class="week-bar-label">'+label+'</div>';
    wg.appendChild(bar);
  });
  var doneWeek=0; for(var j=0;j<=todayIdx;j++){ var d2=new Date(weekStart); d2.setDate(weekStart.getDate()+j); var ds2=isoDate(d2); (articlesByDate[ds2]||[]).forEach(function(a){if(isDone(a))doneWeek++;}); }
  var daysWithContent=vals.filter(function(v){return v>0;}).length;
  document.getElementById("wsDone").textContent=doneWeek;
  document.getElementById("wsDays").textContent=daysWithContent+"/7";
  document.getElementById("wsTotal").textContent=totalWeek;
  var ws=weekStart.getFullYear()+"年"+(weekStart.getMonth()+1)+"月"+weekStart.getDate()+"日 — 至今";
  document.getElementById("weekSub").textContent=ws+" · 本周学习概览";
  // 分类完成
  var wcl=document.getElementById("weekCatList"); wcl.innerHTML="";
  navCats.forEach(function(cid){
    var cat=catMap[cid]; var arts=articles.filter(function(a){return a.category===cid;});
    var dn=arts.filter(isDone).length, tot=arts.length, pct=tot?Math.round(dn/tot*100):0;
    var row=document.createElement("div");
    row.style.cssText="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:.5px solid var(--rule-soft);";
    row.innerHTML='<div style="width:80px;font-size:13px;font-weight:600;">'+(cat.icon||"")+" "+cat.name+'</div><div style="flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:var(--blue);border-radius:4px;transition:width .6s;"></div></div><div style="width:60px;text-align:right;font-size:13px;color:var(--muted);">'+dn+'/'+tot+'</div>';
    wcl.appendChild(row);
  });
  var rows=wcl.querySelectorAll("div[style]"); if(rows.length) rows[rows.length-1].style.borderBottom="none";
  // 周导图
  var maps=articles.filter(function(a){return a.weekly;});
  var wml=document.getElementById("weekMapList");
  if(!maps.length){ wml.innerHTML='<div class="empty-hint">每周日自动生成思维导图汇总<br>生成后运行 sync_data.py 刷新</div>'; }
  else { wml.innerHTML=""; maps.forEach(function(a){wml.appendChild(renderItem(a,false));}); }
}

/* ===== 全量渲染 ===== */
function renderAll(){
  renderStats(); renderTodayUpdate(); renderProgress(); renderStreak(); renderWeek();
}
renderCal(); renderAll();

})();
</script>
